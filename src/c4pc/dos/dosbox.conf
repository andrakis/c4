# DOSBox-X for c4pc: run it with -conf DOSBOX.CONF from this folder, then
# C4PC for the text screen, or C4PC DESKTOP.CFG for C4IX's desktop in a
# VESA mode (video in the .CFG; DOSBox-X's vmemsize of 8 MB holds up to
# 1024 x 768 x 32). C4PC.COM needs the memory the BIOS reports, so DOSBox's
# own XMS and EMS are off. 512 MB: the whole disk (DISK.TAR, 160 MB) is
# copied into memory, and the desktop's machine wants 96 MB or so, the swap
# C4IX pages out to living in c4pc's memory. Plain DOSBox (0.74) has 63 MB
# at most, and stops in C4PC.COM while it copies the disk (2026-11-22, not
# yet understood); .c4pc/small.tar is a disk for 63 MB, without the games
# or the desktop.
[dosbox]
memsize=512
machine=svga_s3
vmemsize=8
[cpu]
core=dynamic
cycles=max
[dos]
xms=false
ems=false
umb=false
[autoexec]
mount c .
c:
C4PC
