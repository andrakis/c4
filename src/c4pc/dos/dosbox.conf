# DOSBox (0.74 or later) and DOSBox-X for c4pc: run DOSBox with -conf
# DOSBOX.CONF from this folder. C4PC.COM needs the memory the BIOS reports,
# so DOSBox's own XMS and EMS are off; 63 MB is plain DOSBox's most
# (DOSBox-X takes more: memsize=512 and the whole disk, DISK.TAR from
# make .c4pc/disk.tar, -m 64 in C4PC.CFG).
[dosbox]
memsize=63
machine=svga_s3
[cpu]
core=dynamic
cycles=max
[dos]
xms=false
ems=false
umb=false
[autoexec]
mount c .
c:
C4PC
