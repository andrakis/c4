# The menu of a disk C4IX is installed on (src/c4ix/user/install.c,
# docs/c4ix-install.md): the boot disc's (grub.cfg), from the disk. GRUB
# is in its first sectors, this file and c4pc in partition 1's /boot,
# and the system's files -- the boot disc's disk.tar -- in partition 2,
# as they are: @DISK@ is its block list, (hd0,msdos2)0+SECTORS. C4IX
# mounts partition 1's /home at /home (--home @HOME@): the person's files
# are kept there, on the disk.
set timeout=5
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
menuentry "C4IX desktop on c4pc (128 MB, MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc.elf --mmu -m 128 -- --desktop --home @HOME@
  module /boot/c4ix32.c4r c4ix32.c4r
  module @DISK@ disk.tar drive
}
menuentry "C4IX desktop on c4pc, x86-64 (128 MB, MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc64.elf --mmu -m 128 -- --desktop --home @HOME@
  module /boot/c4ix32.c4r c4ix32.c4r
  module @DISK@ disk.tar drive
}
menuentry "C4IX desktop on c4pc, x86-64, every processor (128 MB, MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc64.elf --mmu --cpus all -m 128 -- --desktop --home @HOME@
  module /boot/c4ix32.c4r c4ix32.c4r
  module @DISK@ disk.tar drive
}
menuentry "C4IX on c4pc, text (64 MB, MMU)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --mmu -m 64 -- --home @HOME@
  module /boot/c4ix32.c4r c4ix32.c4r
  module @DISK@ disk.tar drive
}
menuentry "C4IX on c4pc, text (64 MB, no MMU)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --no-mmu -m 64 -- --home @HOME@
  module /boot/c4ix32.c4r c4ix32.c4r
  module @DISK@ disk.tar drive
}
