# The menu of a disk the 32-bit C4IX is installed on (src/c4ix/user/
# install.c, docs/c4ix-install.md): the boot disc's (grub.cfg), from the
# disk. GRUB is in its first sectors; c4pc, the kernel and this file are
# in partition 1's /boot, and the whole system is that partition's /:
# --root @ROOT@ (install puts the partition's name there, hd0p1) mounts it
# at / in place of the boot disc's files, so there is no drive to load.
# install copies every /boot file a multiboot or module line here names.
set timeout=5
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
menuentry "C4IX desktop on c4pc (MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc.elf --mmu -- --root @ROOT@ --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
}
menuentry "C4IX desktop on c4pc, every processor (MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc.elf --mmu --cpus all -- --root @ROOT@ --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
}
menuentry "C4IX desktop on c4pc, x86-64 (MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc64.elf --mmu -- --root @ROOT@ --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
}
menuentry "C4IX desktop on c4pc, x86-64, every processor (MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc64.elf --mmu --cpus all -- --root @ROOT@ --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
}
menuentry "C4IX on c4pc, text (MMU)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --mmu -- --root @ROOT@
  module /boot/c4ix32.c4r c4ix32.c4r
}
menuentry "C4IX on c4pc, text (no MMU)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --no-mmu -- --root @ROOT@
  module /boot/c4ix32.c4r c4ix32.c4r
}
