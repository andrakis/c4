# The menu of a disk the 64-bit C4IX is installed on (docs/c4pc-64.md):
# grub-disk.cfg's for the 32-bit system, with the 64-bit machine
# (c4pcw64.elf) and kernel (c4ix64.c4r). On the ISO it is
# /boot/grub/disk64.cfg, which install reads where the word is 64 bits; it
# copies every /boot file a multiboot or module line here names, and puts
# the partition's name (hd0p1) for @ROOT@. --root mounts it at /, so there
# is no drive to load.
set timeout=5
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
menuentry "C4IX 64-bit desktop (128 MB, MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pcw64.elf --mmu -m 128 -- --root @ROOT@ --desktop
  module /boot/c4ix64.c4r c4ix64.c4r
}
menuentry "C4IX 64-bit desktop, every processor (128 MB, MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pcw64.elf --mmu --cpus all -m 128 -- --root @ROOT@ --desktop
  module /boot/c4ix64.c4r c4ix64.c4r
}
menuentry "C4IX 64-bit, text (64 MB, MMU)" {
  set gfxpayload=text
  multiboot /boot/c4pcw64.elf --mmu -m 64 -- --root @ROOT@
  module /boot/c4ix64.c4r c4ix64.c4r
}
