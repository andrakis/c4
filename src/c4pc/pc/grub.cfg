# c4pc.iso's menu (make c4pc.iso). The first entry is C4IX's desktop:
# GRUB sets a 1024 x 768 mode (the multiboot header asks; gfxpayload
# says which) and c4pc draws the display there (pc/screen.c), with the
# PS/2 mouse and keyboard; the console stays on COM1. The others keep
# the VGA text screen, the console on it and on COM1, as libjs runs C4IX
# by default (with the MMU) and with --no-mmu. The x86-64 entry is the same machine built
# for long mode (c4pc64.elf): faster where the CPU has it.
# A blank IDE disk is C4IX's to make an ext2 filesystem on (mkfs hd0,
# mount hd0 /home: docs/c4ix-ext2.md); one already the store (persist's,
# drive 1: docs/c4pc.md) stays the store. --store makes a blank disk the
# store instead; no entry here asks for it now.
# A GRUB that sets a graphics mode for the text entries anyway (VMware's)
# gets the console drawn there.
# --cpus all: C4IX on every processor the PC has, each one of the
# machine's CPUs (M7: pc/ap.c, par.c); one CPU is the default, as the
# web page's is.
set timeout=5
# The screen's size for the desktop entries (Screen size, below): the
# mode c4pc sets on VMware's SVGA II or the BGA (--gui), and GRUB's own
# where c4pc has neither (gfxpayload, falling back to 1024 x 768). The
# desktop starts at it unless Settings chose another, which it remembers.
if [ -z "$c4pc_gui" ]; then set c4pc_gui=1024x768; fi
export c4pc_gui
insmod all_video
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
menuentry "C4IX desktop (with games)" {
  set gfxpayload=${c4pc_gui}x32,${c4pc_gui},1024x768x32,1024x768
  multiboot /boot/c4pc.elf --gui $c4pc_gui --mmu -- --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX desktop, every processor (with games)" {
  set gfxpayload=${c4pc_gui}x32,${c4pc_gui},1024x768x32,1024x768
  multiboot /boot/c4pc.elf --gui $c4pc_gui --mmu --cpus all -- --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4PC hypervisor: this CD's C4IX runs the machines (vm)" {
  set gfxpayload=${c4pc_gui}x32,${c4pc_gui},1024x768x32,1024x768
  multiboot /boot/c4pc.elf --gui $c4pc_gui --hv --mmu -- --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "x86-64 host: C4IX desktop (with games)" {
  set gfxpayload=${c4pc_gui}x32,${c4pc_gui},1024x768x32,1024x768
  multiboot /boot/c4pc64.elf --gui $c4pc_gui --mmu -- --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "x86-64 host: C4IX desktop, every processor (with games)" {
  set gfxpayload=${c4pc_gui}x32,${c4pc_gui},1024x768x32,1024x768
  multiboot /boot/c4pc64.elf --gui $c4pc_gui --mmu --cpus all -- --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
# The 64-bit system (docs/c4pc-64.md): C4IX compiled 64-bit, its kernel,
# libraries, programs, desktop and compilers, on the 64-bit machine
# (c4pcw64.elf, native c4m's word), from its own disk (disk64.tar). No
# games yet: those are the 32-bit system's, above.
menuentry "C4IX 64-bit desktop (no games yet)" {
  set gfxpayload=${c4pc_gui}x32,${c4pc_gui},1024x768x32,1024x768
  multiboot /boot/c4pcw64.elf --gui $c4pc_gui --mmu -- --desktop --no-top
  module /boot/c4ix64.c4r c4ix64.c4r
  module /boot/disk64.tar disk64.tar drive
}
menuentry "C4IX 64-bit desktop, every processor (no games yet)" {
  set gfxpayload=${c4pc_gui}x32,${c4pc_gui},1024x768x32,1024x768
  multiboot /boot/c4pcw64.elf --gui $c4pc_gui --mmu --cpus all -- --desktop --no-top
  module /boot/c4ix64.c4r c4ix64.c4r
  module /boot/disk64.tar disk64.tar drive
}
menuentry "C4IX 64-bit, text (MMU)" {
  set gfxpayload=text
  multiboot /boot/c4pcw64.elf --mmu
  module /boot/c4ix64.c4r c4ix64.c4r
  module /boot/disk64.tar disk64.tar drive
}
# Install: C4IX onto the first IDE disk, to boot from it without this
# disc (src/c4ix/user/install.c). It ERASES the disk, and says so, and
# asks for "yes" first.
menuentry "Install C4IX onto the IDE disk (erases it: asks first)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --mmu -- -e install
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX on c4pc, text (MMU)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --mmu
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX on c4pc, text (no MMU)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --no-mmu
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX on c4pc, text (MMU, statistics at the end)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --mmu -s
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
# The screen's size for the desktop entries above (c4pc_gui, at the top),
# last, so the entries keep their places
submenu "Screen size: $c4pc_gui (for the desktop entries)" {
  menuentry "800 x 600" { set c4pc_gui=800x600; export c4pc_gui; configfile /boot/grub/grub.cfg }
  menuentry "1024 x 768" { set c4pc_gui=1024x768; export c4pc_gui; configfile /boot/grub/grub.cfg }
  menuentry "1280 x 720" { set c4pc_gui=1280x720; export c4pc_gui; configfile /boot/grub/grub.cfg }
  menuentry "1280 x 800" { set c4pc_gui=1280x800; export c4pc_gui; configfile /boot/grub/grub.cfg }
  menuentry "1280 x 1024" { set c4pc_gui=1280x1024; export c4pc_gui; configfile /boot/grub/grub.cfg }
  menuentry "1366 x 768" { set c4pc_gui=1366x768; export c4pc_gui; configfile /boot/grub/grub.cfg }
  menuentry "1440 x 900" { set c4pc_gui=1440x900; export c4pc_gui; configfile /boot/grub/grub.cfg }
  menuentry "1600 x 900" { set c4pc_gui=1600x900; export c4pc_gui; configfile /boot/grub/grub.cfg }
  menuentry "1600 x 1200" { set c4pc_gui=1600x1200; export c4pc_gui; configfile /boot/grub/grub.cfg }
  menuentry "1680 x 1050" { set c4pc_gui=1680x1050; export c4pc_gui; configfile /boot/grub/grub.cfg }
  menuentry "1920 x 1080" { set c4pc_gui=1920x1080; export c4pc_gui; configfile /boot/grub/grub.cfg }
  menuentry "1920 x 1200" { set c4pc_gui=1920x1200; export c4pc_gui; configfile /boot/grub/grub.cfg }
}
