# c4pc.iso's menu (make c4pc.iso). The first entry is C4IX's desktop:
# GRUB sets a 1024 x 768 mode (the multiboot header asks; gfxpayload
# says which) and c4pc draws the display there (pc/screen.c), with the
# PS/2 mouse and keyboard; the console stays on COM1. The others keep
# the VGA text screen, the console on it and on COM1, as libjs runs C4IX
# by default (with the MMU) and with --no-mmu. The x86-64 entry is the same machine built
# for long mode (c4pc64.elf): faster where the CPU has it. A GRUB that sets a
# graphics mode for them anyway (VMware's) gets the console drawn there.
set timeout=5
insmod all_video
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
menuentry "C4IX desktop on c4pc (128 MB, MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc.elf --mmu -m 128 -- --desktop
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX desktop on c4pc, x86-64 (128 MB, MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc64.elf --mmu -m 128 -- --desktop
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX on c4pc, text (64 MB, MMU)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --mmu -m 64
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX on c4pc, text (64 MB, no MMU)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --no-mmu -m 64
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX on c4pc, text (128 MB, MMU, statistics at the end)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --mmu -s -m 128
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
