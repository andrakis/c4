# c4pc.iso's menu (make c4pc.iso). The first entry is C4IX's desktop:
# GRUB sets a 1024 x 768 mode (the multiboot header asks; gfxpayload
# says which) and c4pc draws the display there (pc/screen.c), with the
# PS/2 mouse and keyboard; the console stays on COM1. The others keep
# the VGA text screen, the console on it and on COM1, as libjs runs C4IX
# by default (with the MMU) and with --no-mmu. The x86-64 entry is the same machine built
# for long mode (c4pc64.elf): faster where the CPU has it.
# A blank IDE disk is C4IX's to make an ext2 filesystem on (mkfs hd0,
# mount hd0 /home: docs/c4ix-ext2.md); one already the store (persist's,
# drive 1: docs/c4pc.md) stays the store. --store makes a blank disk the
# store instead; no entry here asks for it now.
# A GRUB that sets a graphics mode for the text entries anyway (VMware's)
# gets the console drawn there.
# --cpus all: C4IX on every processor the PC has, each one of the
# machine's CPUs (M7: pc/ap.c, par.c); one CPU is the default, as the
# web page's is.
set timeout=5
insmod all_video
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
menuentry "C4IX desktop on c4pc (MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc.elf --mmu -- --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX desktop on c4pc, every processor (MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc.elf --mmu --cpus all -- --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX desktop on c4pc, x86-64 (MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc64.elf --mmu -- --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX desktop on c4pc, x86-64, every processor (MMU)" {
  set gfxpayload=1024x768x32,1024x768
  multiboot /boot/c4pc64.elf --mmu --cpus all -- --desktop --no-top
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
# Install: C4IX onto the first IDE disk, to boot from it without this
# disc (src/c4ix/user/install.c). It ERASES the disk, and says so, and
# asks for "yes" first.
menuentry "Install C4IX onto the IDE disk (erases it: asks first)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --mmu -- -e install
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX on c4pc, text (MMU)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --mmu
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX on c4pc, text (no MMU)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --no-mmu
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX on c4pc, text (MMU, statistics at the end)" {
  set gfxpayload=text
  multiboot /boot/c4pc.elf --mmu -s
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
