# c4pc.iso's menu (make c4pc.iso): C4IX on c4pc, the console on the
# screen and on COM1. The first entry runs C4IX as libjs does by
# default, with the MMU; the second as libjs --no-mmu.
set timeout=5
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
menuentry "C4IX on c4pc (64 MB, MMU)" {
  multiboot /boot/c4pc.elf --mmu -m 64
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX on c4pc (64 MB, no MMU)" {
  multiboot /boot/c4pc.elf --no-mmu -m 64
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
menuentry "C4IX on c4pc (128 MB, MMU, statistics at the end)" {
  multiboot /boot/c4pc.elf --mmu -s -m 128
  module /boot/c4ix32.c4r c4ix32.c4r
  module /boot/disk.tar disk.tar drive
}
